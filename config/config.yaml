# Committed run config for the local pipeline:
#   python -m src.run_pipeline --config config/config.yaml
# Local paths only, no secrets. Cloud paths belong in a separate config file
# (for example config/config.databricks.yaml), not here.

environment: local

# Gitignored. Created with a random PII hash salt on first run if missing.
secrets_file: config/secrets.json

sources:
  dim_campaign:
    local_path: data/marketing/dim_campaign.csv
    format: csv
    options:
      header: true

  marketing_spend_daily:
    local_path: data/marketing/marketing_spend_daily.csv
    format: csv
    options:
      header: true

  leads:
    local_path: data/marketing/leads.csv
    format: csv
    options:
      header: true

  consent_events:
    local_path: data/marketing/consent_events.json
    format: json
    options:
      multiLine: true

  calls_uk_au:
    local_path: data/contact_centre/calls_uk_au.csv
    format: csv
    options:
      header: true

  calls_ca_us:
    local_path: data/contact_centre/calls_ca_us.csv
    format: csv
    options:
      header: true
      sep: ","  # starter config said ";" but the file is comma-delimited (defect 1)

  dim_agent:
    local_path: data/contact_centre/dim_agent.csv
    format: csv
    options:
      header: true

  policies:
    local_path: data/finance/policies.csv
    format: csv
    options:
      header: true

  fx_rates_monthly:
    local_path: data/finance/fx_rates_monthly.csv
    format: csv
    options:
      header: true

  ref_channel:
    local_path: data/reference/ref_channel.csv
    format: csv
    options:
      header: true

  ref_region:
    local_path: data/reference/ref_region.csv
    format: csv
    options:
      header: true

  sec_user_region:
    local_path: data/reference/sec_user_region.csv
    format: csv
    options:
      header: true


# Call timestamps (assumption 5, defect 15). Source timezone per region: UTC keeps the
# stored value; an IANA zone converts local wall-clock time to UTC, DST-aware.
calls:
  source_timezone:
    UK: UTC
    AU: Australia/Sydney
    CA: UTC
    US: UTC
  # Converted, but first calls still come about 8.5 h after the lead: flagged, open.
  residual_offset_regions: [AU]

# Minor-unit spend (assumption 6, defect 11): a row whose CPM is at least ratio_threshold
# times its currency's median CPM is divided by divisor if the result lands in
# rescaled_band (times the median); otherwise it is quarantined as ambiguous.
spend:
  minor_units:
    ratio_threshold: 20
    rescaled_band: [0.5, 2.0]
    divisor: 100

# DQ gate (python -m src.dq_gate; docs/RUNBOOK.md "Data-quality gates and thresholds").
# One line per error-severity check: the count per full run that the register predicts,
# its defect, the register's evidence and the test that proves the count. Built from
# docs/DEFECT_REGISTER.md, not copied from a run. Fails above a line, on an error check
# with no line, or on a total above the sum (602); warns below a line.
dq_gate:
  expected_errors:
    - check_name: lead_pk_conflict
      defect_id: 2
      expected: 6
      register: "3 ids appear twice; both rows of each are quarantined"
      test: tests/test_silver_leads.py::test_lead_ids_reconcile
    - check_name: lead_unidentifiable
      defect_id: 4
      expected: 35
      register: "35 leads with both email and phone null"
      test: tests/test_silver_leads.py::test_quarantine_and_flag_counts
    - check_name: fx_rate_missing
      defect_id: 12
      expected: 1
      register: "No CAD rate for 2026-06: one missing currency-month"
      test: tests/test_silver_reference.py::test_real_missing_cad_june_is_an_error_not_a_null
    - check_name: spend_fx_rate_missing
      defect_id: 12
      expected: 180
      register: "180 distinct CAD June spend rows (187 with copies; copies go first)"
      test: tests/test_silver_spend.py::test_spend_dq_counts
    - check_name: call_timestamp_unparseable
      defect_id: 14
      expected: 0
      register: "Every call timestamp parses once the per-file formats are applied"
      test: tests/test_silver_calls.py::test_call_rows_reconcile_rule_by_rule
    - check_name: call_end_before_start
      defect_id: 16
      expected: 380
      register: "380 distinct calls end before they start"
      test: tests/test_silver_calls.py::test_call_quarantine_and_flag_counts

lakehouse:
  local_root: lakehouse
