# Copy to config/config.yaml and adjust as needed. Ingestion must read this
# file, not hardcode paths in src/. The `environment` switch is the single
# place that decides whether `sources.*.local_path` or `sources.*.azure_path`
# is used at run time.

environment: local # local | azure

secrets_file: config/secrets.json

storage:
  local_root: data
  azure_storage_account: nfsdatalakedev
  azure_container: raw

sources:
  dim_campaign:
    local_path: data/marketing/dim_campaign.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/marketing/dim_campaign.csv
    format: csv
    options:
      header: true

  marketing_spend_daily:
    local_path: data/marketing/marketing_spend_daily.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/marketing/marketing_spend_daily.csv
    format: csv
    options:
      header: true

  leads:
    local_path: data/marketing/leads.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/marketing/leads.csv
    format: csv
    options:
      header: true

  consent_events:
    local_path: data/marketing/consent_events.json
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/marketing/consent_events.json
    format: json
    options:
      multiLine: true

  calls_uk_au:
    local_path: data/contact_centre/calls_uk_au.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/contact_centre/calls_uk_au.csv
    format: csv
    options:
      header: true

  calls_ca_us:
    local_path: data/contact_centre/calls_ca_us.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/contact_centre/calls_ca_us.csv
    format: csv
    options:
      header: true
      sep: ";"

  dim_agent:
    local_path: data/contact_centre/dim_agent.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/contact_centre/dim_agent.csv
    format: csv
    options:
      header: true

  policies:
    local_path: data/finance/policies.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/finance/policies.csv
    format: csv
    options:
      header: true

  fx_rates_monthly:
    local_path: data/finance/fx_rates_monthly.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/finance/fx_rates_monthly.csv
    format: csv
    options:
      header: true

  ref_channel:
    local_path: data/reference/ref_channel.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/reference/ref_channel.csv
    format: csv
    options:
      header: true

  ref_region:
    local_path: data/reference/ref_region.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/reference/ref_region.csv
    format: csv
    options:
      header: true

  sec_user_region:
    local_path: data/reference/sec_user_region.csv
    azure_path: abfss://raw@nfsdatalakedev.dfs.core.windows.net/reference/sec_user_region.csv
    format: csv
    options:
      header: true

lakehouse:
  local_root: lakehouse
  azure_root: abfss://lakehouse@nfsdatalakedev.dfs.core.windows.net
